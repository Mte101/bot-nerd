events {}
http {
  server {
    listen 80;
    client_max_body_size 25m;
    location /api/     { proxy_pass http://backend:8000/api/;     proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
    location /uploads/ { proxy_pass http://backend:8000/uploads/; proxy_set_header Host $host; }
    location /health   { proxy_pass http://backend:8000/health;   proxy_set_header Host $host; }
    location /         { proxy_pass http://frontend:3000/;        proxy_set_header Host $host; }
  }
}
