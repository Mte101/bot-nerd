services:
  demo-proxy:
    build:
      context: ./demo-proxy
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-21402}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bot_nerd_user:bot_nerd_pass@postgres:5432/bot_nerd_db
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=bot_nerd_user
      - POSTGRES_PASSWORD=bot_nerd_pass
      - POSTGRES_DB=bot_nerd_db
    volumes:
      - bot-nerd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_nerd_user -d bot_nerd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  bot-nerd-postgres-data:
    driver: local
